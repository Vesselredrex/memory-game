<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Front Card Gradient -->
    <linearGradient id="frontCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Back Card Gradient -->
    <linearGradient id="backCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Brain / Match Icon Gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    
    <!-- Sparkle Glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle (Favicon Shape) -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Background Decorative Grid Lines (Memory Matrix theme) -->
  <path d="M 64,170 H 448 M 64,342 H 448 M 170,64 V 448 M 342,64 V 448" 
        stroke="#ffffff" stroke-opacity="0.04" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Left Card (Back / Pattern) -->
  <g filter="url(#shadow)" transform="rotate(-12, 210, 270)">
    <rect x="95" y="145" width="220" height="270" rx="24" fill="url(#backCardGrad)" stroke="#f472b6" stroke-width="4" />
    <!-- Card Back Pattern / Question Mark Symbol -->
    <path d="M 205,230 C 205,200 235,190 235,220 C 235,245 205,255 205,280 M 205,310 V 315" 
          fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>

  <!-- Right Card (Front / Matched State) -->
  <g filter="url(#shadow)" transform="rotate(8, 300, 250)">
    <rect x="195" y="115" width="220" height="270" rx="24" fill="url(#frontCardGrad)" stroke="#818cf8" stroke-width="4" />
    
    <!-- Brain / Memory Icon on Card -->
    <g transform="translate(240, 180) scale(0.65)" fill="url(#iconGrad)">
      <!-- Left Brain Hemisphere -->
      <path d="M 80,30 C 40,30 10,60 10,100 C 10,120 20,135 30,150 C 15,165 15,190 30,210 C 45,230 70,230 80,210 V 30 Z" />
      <!-- Right Brain Hemisphere -->
      <path d="M 100,30 C 140,30 170,60 170,100 C 170,120 160,135 150,150 C 165,165 165,190 150,210 C 135,230 110,230 100,210 V 30 Z" />
      <!-- Brain Nodes/Details -->
      <circle cx="50" cy="90" r="8" fill="#4f46e5" />
      <circle cx="130" cy="90" r="8" fill="#4f46e5" />
      <circle cx="60" cy="160" r="8" fill="#4f46e5" />
      <circle cx="120" cy="160" r="8" fill="#4f46e5" />
    </g>

    <!-- Star / Match Indicator Badge -->
    <circle cx="385" cy="135" r="28" fill="#38bdf8" />
    <path d="M 373,135 L 381,143 L 397,127" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkles / Magic Effect -->
  <g filter="url(#glow)">
    <!-- Sparkle 1 -->
    <path d="M 140,100 Q 140,120 120,120 Q 140,120 140,140 Q 140,120 160,120 Q 140,120 140,100 Z" fill="#fbbf24" />
    <!-- Sparkle 2 -->
    <path d="M 410,380 Q 410,395 395,395 Q 410,395 410,410 Q 410,395 425,395 Q 410,395 410,380 Z" fill="#f472b6" />
    <!-- Small Dot Sparkles -->
    <circle cx="110" cy="160" r="4" fill="#38bdf8" />
    <circle cx="430" cy="340" r="6" fill="#fbbf24" />
  </g>
</svg>
